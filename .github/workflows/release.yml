name: release
on:
  push:
    branches:
      - main
permissions:
  contents: read # default for all jobs

jobs:
  main:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push tags, create GitHub releases
      issues: write # comment on/label released issues
      pull-requests: write # comment on released PRs
    environment:
      name: release
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@v5
        with:
          semantic_version: 26.0.1
          extra_plugins: |
            @semantic-release/changelog@7.0.0
            @semantic-release/git@11.0.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
